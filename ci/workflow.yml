name: ci
on:
 push:
   branches: [main]
 pull_request:
jobs:
 gates:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
       with:
         node-version: 22
         cache: npm
     - run: npm ci
     - name: Lint
       run: npm run lint -- --max-warnings=0
     - name: Typecheck
       run: npx tsc --noEmit
     - name: Unit + smoke tests
       run: npm test
     - name: Build (deploy gate)
       run: npm run build
